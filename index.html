<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Coisable</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    max-width: 760px;
    margin: 0 auto;
    padding:
        env(safe-area-inset-top)
        16px
        calc(30px + env(safe-area-inset-bottom));
}

.view {
    display: none;
}

.view.active {
    display: block;
}

h1,
h2,
h3 {
    margin: 0;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.topbar h2 {
    font-size: 22px;
    flex: 1;
}

.back {
    border: 0;
    background: none;
    padding: 8px 0;
    color: #111;
    font-weight: 600;
}

.back.small {
    font-size: 14px;
}

.hero {
    padding: 30px 4px 22px;
}

.hero h1 {
    font-size: 34px;
    letter-spacing: -1px;
}

.hero p {
    margin: 8px 0 0;
    color: #777;
    font-size: 16px;
}

.card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow:
        0 1px 3px rgba(0,0,0,.05);
}

.empty {
    color: #777;
    text-align: center;
    padding: 28px 16px;
}

.section {
    margin-top: 18px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 0 10px;
}

.section-title h3 {
    font-size: 18px;
}

.category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.category-card {
    background: #fff;
    border-radius: 18px;
    padding: 20px 16px;
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow:
        0 1px 3px rgba(0,0,0,.05);
    cursor: pointer;
}

.category-icon {
    font-size: 30px;
}

.category-name {
    font-weight: 700;
    font-size: 16px;
}

.category-count {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.primary {
    border: 0;
    border-radius: 12px;
    background: #111;
    color: #fff;
    padding: 12px 16px;
    font-weight: 600;
}

.secondary {
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fff;
    color: #111;
    padding: 10px 14px;
    font-weight: 600;
}

.secondary.small,
.primary.small {
    padding: 8px 11px;
    font-size: 13px;
}

.danger {
    border: 1px solid #e0b8b8;
    border-radius: 10px;
    background: #fff;
    color: #b00020;
    padding: 10px 14px;
    font-weight: 600;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 7px;
    font-weight: 600;
}

.form-group input,
.form-group select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 11px;
    background: #fff;
    padding: 12px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #999;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.form-actions button {
    flex: 1;
}

.detail-value {
    padding: 12px 0;
    border-top: 1px solid #eee;
}

.detail-label {
    color: #777;
    font-size: 13px;
    margin-bottom: 4px;
}

.thing-card {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
}

.icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f1f1;
    font-size: 25px;
    flex-shrink: 0;
}

.thing-info {
    flex: 1;
}

.thing-info strong {
    display: block;
    font-size: 16px;
}

.thing-info span {
    display: block;
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.document-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.document-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
}

.document-info {
    flex: 1;
    min-width: 0;
}

.document-info strong {
    display: block;
    font-size: 15px;
}

.document-info span {
    display: block;
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.document-actions {
    flex-shrink: 0;
}

.attachment-indicator {
    color: #555 !important;
}

.coming-up {
    border-left: 4px solid #ddd;
}

.coming-up-overdue {
    border-left: 4px solid #999;
}

.coming-up-title {
    font-weight: 700;
    font-size: 15px;
}

.coming-up-meta {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.coming-up-status {
    font-size: 13px;
    font-weight: 600;
    margin-top: 7px;
}

.coming-up-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
}

.search-wrap {
    position: relative;
    margin-bottom: 18px;
}

.search-input {
    width: 100%;
    border: 0;
    background: #fff;
    border-radius: 14px;
    padding: 14px 42px 14px 16px;
    box-shadow:
        0 1px 3px rgba(0,0,0,.05);
    outline: none;
}

.search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: #eee;
    display: none;
    align-items: center;
    justify-content: center;
}

.search-result {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.search-result-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 21px;
}

.search-result-info {
    flex: 1;
    min-width: 0;
}

.search-result-info strong {
    display: block;
}

.search-result-info span {
    display: block;
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.search-result-type {
    font-size: 11px !important;
    font-weight: 600;
}

.search-result-chevron {
    color: #aaa;
    font-size: 24px;
}

.search-empty {
    text-align: center;
    padding: 30px;
}

.search-empty-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.timeline-month {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
}

.timeline-month-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.month-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chevron {
    color: #aaa;
    font-size: 25px;
}

.timeline-events {
    margin-top: 12px;
}

.timeline-event {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 48px;
    border-top: 1px solid #eee;
    cursor: pointer;
}

.timeline-event-date {
    width: 26px;
    font-size: 12px;
    color: #777;
    text-align: center;
    flex-shrink: 0;
}

.event-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.timeline-event-info {
    flex: 1;
    min-width: 0;
}

.timeline-event-info strong {
    font-size: 14px;
    font-weight: 600;
}

.timeline-event-amount {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.timeline-event-chevron {
    color: #aaa;
    font-size: 21px;
}

.timeline-info {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 11px;
    color: #666;
    font-size: 12px;
    margin-bottom: 15px;
}

.attachment-section {
    margin-top: 18px;
}

.attachment-label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 7px;
    font-weight: 600;
}

.attachment-picker {
    width: 100%;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 14px;
    background: #fafafa;
}

.attachment-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.attachment-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
}

.attachment-info {
    flex: 1;
    min-width: 0;
}

.attachment-info strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.attachment-info span {
    display: block;
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.attachment-actions {
    flex-shrink: 0;
}

.attachment-remove-row {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
}

.attachment-status {
    color: #777;
    font-size: 12px;
    margin-top: 7px;
}

.attachment-viewer {
    height: calc(100vh - 180px);
    height: calc(100dvh - 180px);
    min-height: 450px;
    max-height: 800px;
    background: #222;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.attachment-viewer-toolbar {
    height: 54px;
    min-height: 54px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px;
    z-index: 2;
}

.attachment-viewer-toolbar button {
    color: #111;
    background: #fff;
    border-color: #ddd;
}

.attachment-zoom-label {
    min-width: 54px;
    text-align: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
}

.attachment-viewer-inner {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    align-items: center;
    justify-content: center;
}

.attachment-pdf-stage {
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 12px;
}

.attachment-pdf-page {
    flex-shrink: 0;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
}

.attachment-pdf-page canvas {
    display: block;
}

.attachment-pdf-loading {
    width: 100%;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ddd;
    font-size: 14px;
    text-align: center;
}

.attachment-pdf-error {
    width: 100%;
    padding: 40px 20px;
    text-align: center;
    color: #ddd;
}

.attachment-image-stage {
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

.attachment-image-stage img {
    display: block;
    flex-shrink: 0;
}

@media (max-width: 480px) {

    .hero h1 {
        font-size: 30px;
    }

    .attachment-viewer {
        min-height: 400px;
    }

    .attachment-viewer-toolbar {
        gap: 4px;
    }

    .attachment-viewer-toolbar button {
        padding-left: 9px;
        padding-right: 9px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     HOME
====================================================== -->

<div id="homeView" class="view active">

    <div class="hero">

        <h1>Coisable</h1>

        <p>
            Your things. One place.
        </p>

    </div>

    <div class="search-wrap">

        <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="🔎 Search your things"
            oninput="handleSearch()">

        <button
            id="searchClear"
            class="search-clear"
            onclick="clearSearch()">
            ×
        </button>

    </div>

    <div id="normalHomeContent">

        <div class="category-grid">

            <div
                class="category-card"
                onclick="showCategory('Real Estate')">

                <div class="category-icon">
                    🏠
                </div>

                <div>

                    <div class="category-name">
                        Real Estate
                    </div>

                    <div class="category-count">

                        <span id="realEstateCount">
                            0
                        </span>

                        <span id="realEstateLabel">
                            things
                        </span>

                    </div>

                </div>

            </div>

            <div
                class="category-card"
                onclick="showCategory('Vehicles')">

                <div class="category-icon">
                    🚗
                </div>

                <div>

                    <div class="category-name">
                        Vehicles
                    </div>

                    <div class="category-count">

                        <span id="vehiclesCount">
                            0
                        </span>

                        <span id="vehiclesLabel">
                            things
                        </span>

                    </div>

                </div>

            </div>

            <div
                class="category-card"
                onclick="showCategory('Electronics')">

                <div class="category-icon">
                    💻
                </div>

                <div>

                    <div class="category-name">
                        Electronics
                    </div>

                    <div class="category-count">

                        <span id="electronicsCount">
                            0
                        </span>

                        <span id="electronicsLabel">
                            things
                        </span>

                    </div>

                </div>

            </div>

            <div
                class="category-card"
                onclick="showCategory('Other')">

                <div class="category-icon">
                    📦
                </div>

                <div>

                    <div class="category-name">
                        Other
                    </div>

                    <div class="category-count">

                        <span id="otherCount">
                            0
                        </span>

                        <span id="otherLabel">
                            things
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div class="section">

            <div class="section-title">

                <h3>
                    Coming Up
                </h3>

            </div>

            <div id="comingUp"></div>

        </div>

    </div>

    <div id="searchResults"></div>

</div>


<!-- =====================================================
     CATEGORY
====================================================== -->

<div id="categoryView" class="view">

    <div class="topbar">

        <button
            class="back"
            onclick="showHome()">
            ← Back
        </button>

        <h2 id="categoryTitle">
            Category
        </h2>

    </div>

    <div class="section-title">

        <div></div>

        <button
            id="categoryAddButton"
            class="primary"
            onclick="showAddForm()">
            + Add
        </button>

    </div>

    <div id="categoryThingsList"></div>

</div>


<!-- =====================================================
     ADD THING
====================================================== -->

<div id="addView" class="view">

    <div class="topbar">

        <button
            class="back"
            onclick="showCategory(currentCategory)">
            ← Back
        </button>

        <h2 id="addThingTitle">
            Add
        </h2>

    </div>

    <div class="card">

        <div class="form-group">

            <label>
                Name
            </label>

            <input
                id="thingName"
                type="text"
                placeholder="e.g. Mazda MX-5">

        </div>

        <div class="form-group">

            <label>
                Category
            </label>

            <select id="thingCategory">

                <option>
                    Real Estate
                </option>

                <option>
                    Vehicles
                </option>

                <option>
                    Electronics
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Purchase Date
            </label>

            <input
                id="thingPurchaseDate"
                type="date">

        </div>

        <div class="form-group">

            <label>
                Purchase Price
            </label>

            <input
                id="thingPurchasePrice"
                type="number"
                step="0.01"
                inputmode="decimal">

        </div>

        <div class="form-group">

            <label>
                Current Value
            </label>

            <input
                id="thingCurrentValue"
                type="number"
                step="0.01"
                inputmode="decimal">

        </div>

        <div class="form-actions">

            <button
                class="secondary"
                onclick="showCategory(currentCategory)">
                Cancel
            </button>

            <button
                class="primary"
                onclick="addThing()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     DETAIL
====================================================== -->

<div id="detailView" class="view">

    <div class="topbar">

        <button
            class="back"
            onclick="showCategory(currentThingCategory)">
            ← Back
        </button>

        <h2 id="detailTitle">
            Thing
        </h2>

        <button
            class="secondary small"
            onclick="editThing()">
            Edit
        </button>

    </div>

    <div id="thingDetails"></div>

    <div class="section-title">

        <h3>
            Documents
        </h3>

        <button
            class="primary small"
            onclick="showAddDocument()">
            + Add
        </button>

    </div>

    <div id="documentsList"></div>

    <div class="section-title">

        <h3>
            Timeline
        </h3>

        <button
            class="primary small"
            onclick="showAddEvent()">
            + Add
        </button>

    </div>

    <div id="timelineList"></div>

    <div class="section">

        <button
            class="danger"
            style="width:100%;"
            onclick="deleteThing()">
            Delete Thing
        </button>

    </div>

</div>


<!-- =====================================================
     EDIT THING
====================================================== -->

<div id="editView" class="view">

    <div class="topbar">

        <button
            class="back"
            onclick="showThing(currentThingId)">
            ← Back
        </button>

        <h2>
            Edit Thing
        </h2>

    </div>

    <div class="card">

        <div class="form-group">

            <label>
                Name
            </label>

            <input
                id="editThingName"
                type="text">

        </div>

        <div class="form-group">

            <label>
                Category
            </label>

            <select id="editThingCategory">

                <option>
                    Real Estate
                </option>

                <option>
                    Vehicles
                </option>

                <option>
                    Electronics
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Purchase Date
            </label>

            <input
                id="editThingPurchaseDate"
                type="date">

        </div>

        <div class="form-group">

            <label>
                Purchase Price
            </label>

            <input
                id="editThingPurchasePrice"
                type="number"
                step="0.01"
                inputmode="decimal">

        </div>

        <div class="form-group">

            <label>
                Current Value
            </label>

            <input
                id="editThingCurrentValue"
                type="number"
                step="0.01"
                inputmode="decimal">

        </div>

        <div class="form-actions">

            <button
                class="secondary"
                onclick="showThing(currentThingId)">
                Cancel
            </button>

            <button
                class="primary"
                onclick="saveEdit()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     ADD DOCUMENT
====================================================== -->

<div id="addDocumentView" class="view">

    <div class="topbar">

        <button
            class="back"
            onclick="showThing(currentThingId)">
            ← Back
        </button>

        <h2>
            Add Document
        </h2>

    </div>

    <div class="card">

        <div class="form-group">

            <label>
                Name
            </label>

            <input
                id="documentName"
                type="text"
                placeholder="e.g. Car Insurance">

        </div>

        <div class="form-group">

            <label>
                Type
            </label>

            <select id="documentType">

                <option>
                    Invoice
                </option>

                <option>
                    Contract
                </option>

                <option>
                    Insurance
                </option>

                <option>
                    Warranty
                </option>

                <option>
                    Tax
                </option>

                <option>
                    Certificate
                </option>

                <option>
                    Repair
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Date
            </label>

            <input
                id="documentDate"
                type="date">

        </div>

        <div class="form-group">

            <label>
                Date Type
            </label>

            <select
                id="documentDateType"
                onchange="updateImportantDateField('')">

                <option>
                    None
                </option>

                <option>
                    Due Date
                </option>

                <option>
                    Expiry Date
                </option>

            </select>

        </div>

        <div
            id="documentImportantDateGroup"
            class="form-group"
            style="display:none;">

            <label id="documentImportantDateLabel">
                Important Date
            </label>

            <input
                id="documentImportantDate"
                type="date">

        </div>

        <div class="form-group">

            <label>
                Repeat
            </label>

            <select id="documentRepeat">

                <option>
                    Never
                </option>

                <option>
                    Yearly
                </option>

                <option>
                    Monthly
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Amount

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let things =
    JSON.parse(
        localStorage.getItem(
            "coisableThings"
        )
    ) || [];

let currentThingId =
    null;

let currentThingCategory =
    null;

let currentCategory =
    null;

let currentDocumentId =
    null;

let currentEventId =
    null;


/* =========================================================
   ICONS
========================================================= */

const categoryIcons = {

    "Real Estate":
        "🏠",

    "Vehicles":
        "🚗",

    "Electronics":
        "💻",

    "Other":
        "📦"

};

const documentIcons = {

    Invoice:
        "🧾",

    Contract:
        "📑",

    Insurance:
        "🛡️",

    Warranty:
        "🔧",

    Tax:
        "💶",

    Certificate:
        "📜",

    Repair:
        "🔨",

    Other:
        "📄"

};

const eventIcons = {

    Purchase:
        "🛒",

    Repair:
        "🔨",

    Maintenance:
        "🔧",

    Expense:
        "💶",

    Inspection:
        "🔍",

    Insurance:
        "🛡️",

    Other:
        "📌"

};


/* =========================================================
   INDEXED DB ATTACHMENTS
========================================================= */

const ATTACHMENT_DB_NAME =
    "coisableAttachmentsDB";

const ATTACHMENT_DB_VERSION =
    1;

const ATTACHMENT_STORE =
    "attachments";

let attachmentDB =
    null;

function initAttachmentDB() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const request =
                indexedDB.open(
                    ATTACHMENT_DB_NAME,
                    ATTACHMENT_DB_VERSION
                );

            request.onupgradeneeded =
                function(event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            ATTACHMENT_STORE
                        )
                    ) {

                        db.createObjectStore(
                            ATTACHMENT_STORE,
                            {
                                keyPath:
                                    "documentId"
                            }
                        );

                    }

                };

            request.onsuccess =
                function(event) {

                    attachmentDB =
                        event.target.result;

                    resolve(
                        attachmentDB
                    );

                };

            request.onerror =
                function(event) {

                    reject(
                        event.target.error
                    );

                };

        }
    );

}

async function saveAttachment(
    documentId,
    file
) {

    if (!attachmentDB) {

        await initAttachmentDB();

    }

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const transaction =
                attachmentDB.transaction(
                    [
                        ATTACHMENT_STORE
                    ],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    ATTACHMENT_STORE
                );

            const request =
                store.put(
                    {
                        documentId:
                            documentId,

                        name:
                            file.name,

                        type:
                            file.type,

                        size:
                            file.size,

                        blob:
                            file,

                        createdAt:
                            Date.now()
                    }
                );

            request.onsuccess =
                () =>
                    resolve();

            request.onerror =
                event =>
                    reject(
                        event.target.error
                    );

        }
    );

}

async function getAttachment(
    documentId
) {

    if (!attachmentDB) {

        await initAttachmentDB();

    }

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const transaction =
                attachmentDB.transaction(
                    [
                        ATTACHMENT_STORE
                    ],
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    ATTACHMENT_STORE
                );

            const request =
                store.get(
                    documentId
                );

            request.onsuccess =
                event =>
                    resolve(
                        event.target.result ||
                        null
                    );

            request.onerror =
                event =>
                    reject(
                        event.target.error
                    );

        }
    );

}

async function deleteAttachment(
    documentId
) {

    if (!attachmentDB) {

        await initAttachmentDB();

    }

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const transaction =
                attachmentDB.transaction(
                    [
                        ATTACHMENT_STORE
                    ],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    ATTACHMENT_STORE
                );

            const request =
                store.delete(
                    documentId
                );

            request.onsuccess =
                () =>
                    resolve();

            request.onerror =
                event =>
                    reject(
                        event.target.error
                    );

        }
    );

}

async function deleteAttachmentsForThing(
    thing
) {

    if (
        !thing ||
        !Array.isArray(
            thing.documents
        )
    ) {
        return;
    }

    for (
        const documentItem
        of thing.documents
    ) {

        try {

            await deleteAttachment(
                documentItem.id
            );

        } catch(error) {

            console.error(
                error
            );

        }

    }

}

function formatFileSize(
    bytes
) {

    if (
        !bytes ||
        bytes <= 0
    ) {

        return "0 KB";

    }

    if (
        bytes < 1024
    ) {

        return `${bytes} B`;

    }

    if (
        bytes < 1024 * 1024
    ) {

        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;

    }

    return `${(
        bytes /
        (
            1024 * 1024
        )
    ).toFixed(1)} MB`;

}

function getAttachmentIcon(
    type,
    name
) {

    const lowerName =
        String(
            name || ""
        ).toLowerCase();

    if (
        type ===
        "application/pdf" ||
        lowerName.endsWith(
            ".pdf"
        )
    ) {

        return "📄";

    }

    if (
        String(type || "")
            .startsWith(
                "image/"
            )
    ) {

        return "🖼️";

    }

    return "📎";

}


/* =========================================================
   PDF.JS
========================================================= */

let pdfjsLib =
    null;

async function loadPdfJs() {

    if (pdfjsLib) {

        return pdfjsLib;

    }

    pdfjsLib =
        await import(
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs"
        );

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

    return pdfjsLib;

}


/* =========================================================
   ATTACHMENT VIEWER STATE
========================================================= */

let currentAttachmentUrl =
    null;

let attachmentHistoryActive =
    false;

let attachmentZoom =
    1;

let attachmentIsFit =
    true;

let attachmentIsPdf =
    false;

let attachmentPdfDocument =
    null;

let attachmentPdfFitScale =
    1;

let attachmentImageFitScale =
    1;

let attachmentRenderToken =
    0;


/* =========================================================
   ATTACHMENT CHECK
========================================================= */

async function hasAttachment(
    documentId
) {

    try {

        const attachment =
            await getAttachment(
                documentId
            );

        return !!attachment;

    } catch(error) {

        console.error(
            error
        );

        return false;

    }

}


/* =========================================================
   OPEN ATTACHMENT
========================================================= */

async function openAttachment(
    documentId
) {

    try {

        const attachment =
            await getAttachment(
                documentId
            );

        if (!attachment) {

            alert(
                "Attachment not found."
            );

            return;

        }

        const thing =
            things.find(
                item =>
                    Array.isArray(
                        item.documents
                    ) &&
                    item.documents.some(
                        documentItem =>
                            documentItem.id ===
                            documentId
                    )
            );

        if (!thing) {

            alert(
                "The related thing could not be found."
            );

            return;

        }

        currentThingId =
            thing.id;

        currentThingCategory =
            thing.category;

        currentDocumentId =
            documentId;

        attachmentZoom =
            1;

        attachmentIsFit =
            true;

        attachmentIsPdf =
            String(
                attachment.type ||
                ""
            ).toLowerCase() ===
            "application/pdf" ||
            String(
                attachment.name ||
                ""
            ).toLowerCase().endsWith(
                ".pdf"
            );

        attachmentRenderToken++;

        if (
            currentAttachmentUrl
        ) {

            URL.revokeObjectURL(
                currentAttachmentUrl
            );

            currentAttachmentUrl =
                null;

        }

        currentAttachmentUrl =
            URL.createObjectURL(
                attachment.blob
            );

        const viewer =
            document.getElementById(
                "attachmentViewer"
            );

        if (!viewer) return;

        viewer.innerHTML = `

            <div class="attachment-viewer">

                <div class="attachment-viewer-toolbar">

                    <button
                        class="secondary small"
                        onclick="attachmentFit()">
                        Fit
                    </button>

                    <button
                        class="secondary small"
                        onclick="attachmentZoomOut()">
                        −
                    </button>

                    <span
                        id="attachmentZoomLabel"
                        class="attachment-zoom-label">
                        Fit
                    </span>

                    <button
                        class="secondary small"
                        onclick="attachmentZoomIn()">
                        +
                    </button>

                    <button
                        class="secondary small"
                        onclick="attachmentResetZoom()">
                        100%
                    </button>

                </div>

                <div
                    id="attachmentViewerInner"
                    class="attachment-viewer-inner">

                    ${
                        attachmentIsPdf
                        ? `

                            <div
                                id="attachmentPdfStage"
                                class="attachment-pdf-stage">

                                <div class="attachment-pdf-loading">
                                    Loading PDF…
                                </div>

                            </div>

                        `
                        : `

                            <div
                                id="attachmentImageStage"
                                class="attachment-image-stage">

                                <img
                                    id="attachmentImage"
                                    alt="${escapeHtml(
                                        attachment.name
                                    )}">

                            </div>

                        `
                    }

                </div>

            </div>

        `;

        showView(
            "attachmentView"
        );

        if (
            !attachmentHistoryActive
        ) {

            history.pushState(
                {
                    coisableAttachment:
                        true,

                    documentId:
                        documentId

                },
                "",
                window.location.href
            );

            attachmentHistoryActive =
                true;

        }

        if (
            attachmentIsPdf
        ) {

            await loadAndRenderPdf();

        } else {

            const image =
                document.getElementById(
                    "attachmentImage"
                );

            if (!image) return;

            image.onload =
                function() {

                    attachmentImageFitScale =
                        calculateImageFitScale();

                    attachmentIsFit =
                        true;

                    attachmentZoom =
                        1;

                    applyImageZoom();

                };

            image.src =
                currentAttachmentUrl;

        }

    } catch(error) {

        console.error(
            error
        );

        alert(
            "Could not open this attachment."
        );

    }

}


/* =========================================================
   LOAD PDF
========================================================= */

async function loadAndRenderPdf() {

    const stage =
        document.getElementById(
            "attachmentPdfStage"
        );

    if (!stage) return;

    const token =
        ++attachmentRenderToken;

    try {

        const pdfjs =
            await loadPdfJs();

        if (
            token !==
            attachmentRenderToken
        ) {
            return;
        }

        const loadingTask =
            pdfjs.getDocument(
                {
                    url:
                        currentAttachmentUrl
                }
            );

        const pdf =
            await loadingTask.promise;

        if (
            token !==
            attachmentRenderToken
        ) {

            try {
                await pdf.destroy();
            } catch(error) {}

            return;

        }

        attachmentPdfDocument =
            pdf;

        await renderPdf();

    } catch(error) {

        console.error(
            "PDF.js error:",
            error
        );

        if (
            token !==
            attachmentRenderToken
        ) {
            return;
        }

        stage.innerHTML = `

            <div class="attachment-pdf-error">

                <strong>
                    Could not display this PDF.
                </strong>

                <div style="
                    margin-top:8px;
                    font-size:13px;
                ">

                    There was a problem rendering
                    this PDF inside Coisable.

                </div>

            </div>

        `;

    }

}


/* =========================================================
   PDF FIT
========================================================= */

async function calculatePdfFitScale() {

    if (
        !attachmentPdfDocument
    ) {

        return 1;

    }

    const inner =
        document.getElementById(
            "attachmentViewerInner"
        );

    if (!inner) {

        return 1;

    }

    const page =
        await attachmentPdfDocument.getPage(
            1
        );

    const viewport =
        page.getViewport(
            {
                scale: 1
            }
        );

    const availableWidth =
        Math.max(
            inner.clientWidth - 24,
            100
        );

    const availableHeight =
        Math.max(
            inner.clientHeight - 24,
            100
        );

    const widthScale =
        availableWidth /
        viewport.width;

    const heightScale =
        availableHeight /
        viewport.height;

    return Math.min(
        widthScale,
        heightScale,
        1
    );

}


/* =========================================================
   RENDER PDF
========================================================= */

async function renderPdf() {

    if (
        !attachmentPdfDocument
    ) {
        return;
    }

    const stage =
        document.getElementById(
            "attachmentPdfStage"
        );

    if (!stage) return;

    const token =
        ++attachmentRenderToken;

    if (
        attachmentIsFit
    ) {

        attachmentPdfFitScale =
            await calculatePdfFitScale();

    }

    const scale =
        attachmentIsFit
            ? attachmentPdfFitScale
            : attachmentZoom;

    stage.innerHTML =
        "";

    const dpr =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );

    for (
        let pageNumber = 1;
        pageNumber <=
            attachmentPdfDocument.numPages;
        pageNumber++
    ) {

        if (
            token !==
            attachmentRenderToken
        ) {

            return;

        }

        const page =
            await attachmentPdfDocument.getPage(
                pageNumber
            );

        if (
            token !==
            attachmentRenderToken
        ) {

            return;

        }

        const viewport =
            page.getViewport(
                {
                    scale:
                        scale
                }
            );

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "attachment-pdf-page";

        const canvas =
            document.createElement(
                "canvas"
            );

        const context =
            canvas.getContext(
                "2d"
            );

        canvas.width =
            Math.floor(
                viewport.width *
                dpr
            );

        canvas.height =
            Math.floor(
                viewport.height *
                dpr
            );

        canvas.style.width =
            `${viewport.width}px`;

        canvas.style.height =
            `${viewport.height}px`;

        context.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        wrapper.appendChild(
            canvas
        );

        stage.appendChild(
            wrapper
        );

        await page.render(
            {
                canvasContext:
                    context,

                viewport:
                    viewport
            }
        ).promise;

    }

    updateAttachmentZoomLabel();

}


/* =========================================================
   IMAGE FIT
========================================================= */

function calculateImageFitScale() {

    const image =
        document.getElementById(
            "attachmentImage"
        );

    const inner =
        document.getElementById(
            "attachmentViewerInner"
        );

    if (
        !image ||
        !inner ||
        !image.naturalWidth ||
        !image.naturalHeight
    ) {

        return 1;

    }

    const availableWidth =
        Math.max(
            inner.clientWidth - 24,
            100
        );

    const availableHeight =
        Math.max(
            inner.clientHeight - 24,
            100
        );

    const widthScale =
        availableWidth /
        image.naturalWidth;

    const heightScale =
        availableHeight /
        image.naturalHeight;

    return Math.min(
        widthScale,
        heightScale,
        1
    );

}

========================================================= */

async function attachmentFit() {

    attachmentIsFit =
        true;

    attachmentZoom =
        1;

    if (
        attachmentIsPdf
    ) {

        await renderPdf();

    } else {

        attachmentImageFitScale =
            calculateImageFitScale();

        applyImageZoom();

    }

}

async function attachmentResetZoom() {

    attachmentIsFit =
        false;

    attachmentZoom =
        1;

    if (
        attachmentIsPdf
    ) {

        await renderPdf();

    } else {

        applyImageZoom();

    }

}

async function attachmentZoomIn() {

    if (
        attachmentIsFit
    ) {

        attachmentIsFit =
            false;

        attachmentZoom =
            1.25;

    } else {

        attachmentZoom =
            Math.min(
                attachmentZoom +
                0.25,
                3
            );

    }

    if (
        attachmentIsPdf
    ) {

        await renderPdf();

    } else {

        applyImageZoom();

    }

}

async function attachmentZoomOut() {

    if (
        attachmentIsFit
    ) {

        attachmentIsFit =
            false;

        attachmentZoom =
            0.75;

    } else {

        attachmentZoom =
            Math.max(
                attachmentZoom -
                0.25,
                0.5
            );

    }

    if (
        attachmentIsPdf
    ) {

        await renderPdf();

    } else {

        applyImageZoom();

    }

}

function updateAttachmentZoomLabel() {

    const label =
        document.getElementById(
            "attachmentZoomLabel"
        );

    if (!label) return;

    label.textContent =
        attachmentIsFit
            ? "Fit"
            : `${Math.round(
                attachmentZoom *
                100
              )}%`;

}

function applyImageZoom() {

    const image =
        document.getElementById(
            "attachmentImage"
        );

    if (!image) return;

    const scale =
        attachmentIsFit
            ? attachmentImageFitScale
            : attachmentZoom;

    image.style.maxWidth =
        "none";

    image.style.maxHeight =
        "none";

    image.style.width =
        `${image.naturalWidth * scale}px`;

    image.style.height =
        `${image.naturalHeight * scale}px`;

    image.style.transform =
        "none";

    image.style.objectFit =
        "contain";

    updateAttachmentZoomLabel();

}

async function renderExistingAttachment(
    documentId
) {

    const container =
        document.getElementById(
            "editAttachmentContainer"
        );

    if (!container) return;

    container.innerHTML =

    try {

            );

        if (!attachment) {

        }

        const icon =
            getAttachmentIcon(

                attachment.name
            );

        container.innerHTML = `

            <div class="attachment-card">

                <div class="attachment-icon">
                    ${icon}
                </div>

                <div class="attachment-info">

                    <strong>
                        ${escapeHtml(
                            attachment.name
                        )}
                    </strong>

                    <span>
                        ${formatFileSize(
                            attachment.size
                        )}
                    </span>

                </div>

                <div class="attachment-actions">

                    <button
                        class="secondary small"
                        onclick="openAttachment(${documentId})">

                    </button>

                <button

                </button>

            error
        );

            </div>

        `;

    }

async function removeExistingAttachment(
    documentId
) {

    const confirmed =
        confirm(
            "Remove this attachment?"
        );

    if (!confirmed) return;

    try {

        await deleteAttachment(
            documentId
        );

        await renderExistingAttachment(
            documentId
        );

        const status =
            document.getElementById(
                "editAttachmentStatus"
            );

        if (status) {

            status.textContent =
                "Attachment removed.";

        }

        renderDocumentsForCurrentThing();

    } catch(error) {

        console.error(
            error
        );

        alert(
            "Could not remove the attachment."
        );

    }

}

function previewNewAttachment() {

    const input =
        document.getElementById(

    if (!input || !status) return;

/* =========================================================
   SEARCH
========================================================= */

function normalizeSearch(
    value
) {

    return String(
        value || ""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim();

}

function clearSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    if (!input) return;

    input.value =
        "";

    handleSearch();

    input.focus();

}

function updateSearchClearButton(
    hasText
) {

    const button =
        document.getElementById(
            "searchClear"
        );

    if (!button) return;

    button.style.display =
        hasText
            ? "flex"
            : "none";

}

function handleSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    if (!input) return;

    const query =
        normalizeSearch(
            input.value
        );

    const resultsContainer =
        document.getElementById(
            "searchResults"
        );

    const normalHome =
        document.getElementById(
            "normalHomeContent"
        );

    updateSearchClearButton(
        query.length > 0
    );

    if (!query) {

        resultsContainer.style.display =
            "none";

        resultsContainer.innerHTML =
            "";

        normalHome.style.display =
            "block";

        return;

    }

    normalHome.style.display =
        "none";

    const results = [];

    things.forEach(
        thing => {

            const thingName =
                normalizeSearch(
                    thing.name
                );

            const thingCategory =
                normalizeSearch(
                    thing.category
                );

            const thingMatch =
                thingName.includes(
                    query
                ) ||
                thingCategory.includes(
                    query
                );

            if (thingMatch) {

                results.push({

                    kind:
                        "thing",

                    thingId:
                        thing.id,

                    title:
                        thing.name,

                    subtitle:
                        thing.category,

                    resultType:
                        "Thing",

                    icon:
                        categoryIcons[
                            thing.category
                        ] || "📦"

                });

            }

            if (
                Array.isArray(
                    thing.documents
                )
            ) {

                thing.documents.forEach(
                    documentItem => {

                        const documentMatch =
                            normalizeSearch(
                                documentItem.name
                            ).includes(
                                query
                            ) ||
                            normalizeSearch(
                                documentItem.type
                            ).includes(
                                query
                            ) ||
                            thingName.includes(
                                query
                            );

                        if (
                            documentMatch
                        ) {

                            results.push({

                                kind:
                                    "document",

                                thingId:
                                    thing.id,

                                documentId:
                                    documentItem.id,

                                title:
                                    documentItem.name,

                                subtitle:
                                    `${documentItem.type} · ${thing.name}`,

                                resultType:
                                    "Document",

                                icon:
                                    documentIcons[
                                        documentItem.type
                                    ] || "📄"

                            });

                        }

                    }
                );

            }

            if (
                Array.isArray(
                    thing.events
                )
            ) {

                thing.events.forEach(
                    event => {

                        const eventMatch =
                            normalizeSearch(
                                event.description
                            ).includes(
                                query
                            ) ||
                            normalizeSearch(
                                event.type
                            ).includes(
                                query
                            ) ||
                            thingName.includes(
                                query
                            );

                        if (
                            eventMatch
                        ) {

                            results.push({

                                kind:
                                    "event",

                                thingId:
                                    thing.id,

                                eventId:
                                    event.id,

                                title:
                                    event.description,

                                subtitle:
                                    `Timeline · ${thing.name}`,

                                resultType:
                                    "Timeline",

                                icon:
                                    eventIcons[
                                        event.type
                                    ] || "📌"

                            });

                        }

                    }
                );

            }

        }
    );

    if (
        results.length === 0
    ) {

        resultsContainer.style.display =
            "block";

        resultsContainer.innerHTML = `

            <div class="card search-empty">

                <div class="search-empty-icon">
                    🔎
                </div>

                <strong>
                    No results found
                </strong>

                <span>
                    Try another search term.
                </span>

            </div>

        `;

        return;

    }

    resultsContainer.style.display =
        "block";

    resultsContainer.innerHTML =
        results.map(
            result => {

                let action =
                    "";

                if (
                    result.kind ===
                    "thing"
                ) {

                    action =
                        `openThingFromSearch(${result.thingId})`;

                } else if (
                    result.kind ===
                    "document"
                ) {

                    action =
                        `openDocumentFromSearch(${result.thingId}, ${result.documentId})`;

                } else {

                    action =
                        `openEventFromSearch(${result.thingId}, ${result.eventId})`;

                }

                return `

                    <div
                        class="card search-result"
                        onclick="${action}">

                        <div class="search-result-icon">
                            ${result.icon}
                        </div>

                        <div class="search-result-info">

                            <strong>
                                ${escapeHtml(
                                    result.title
                                )}
                            </strong>

                            <span>
                                ${escapeHtml(
                                    result.subtitle
                                )}
                            </span>

                            <span class="search-result-type">
                                ${escapeHtml(
                                    result.resultType
                                )}
                            </span>

                        </div>

                        <div class="search-result-chevron">
                            ›
                        </div>

                    </div>

                `;

            }
        ).join("");

}

function openThingFromSearch(
    thingId
) {

    const thing =
        things.find(
            item =>
                item.id ===
                thingId
        );

    if (!thing) return;

    currentThingId =
        thing.id;

    currentThingCategory =
        thing.category;

    showThing(
        thing.id
    );

}

function openDocumentFromSearch(
    thingId,
    documentId
) {

    const thing =
        things.find(
            item =>
                item.id ===
                thingId
        );

    if (!thing) return;

    currentThingId =
        thing.id;

    currentThingCategory =
        thing.category;

    const documentItem =
        thing.documents &&
        thing.documents.find(
            item =>
                item.id ===
                documentId
        );

    if (!documentItem) {

        showThing(
            thing.id
        );

        return;

    }

    currentDocumentId =
        documentItem.id;

    showThing(
        thing.id
    );

    editDocument(
        documentItem.id
    );

}

function openEventFromSearch(
    thingId,
    eventId
) {

    const thing =
        things.find(
            item =>
                item.id ===
                thingId
        );

    if (!thing) return;

    currentThingId =
        thing.id;

    currentThingCategory =
        thing.category;

    const event =
        thing.events &&
        thing.events.find(
            item =>
                item.id ===
                eventId
        );

    if (!event) {

        showThing(
            thing.id
        );

        return;

    }

    currentEventId =
        event.id;

    showThing(
        thing.id
    );

    openTimelineEvent(
        event.id
    );

}

function renderCategoryCounts() {

            "vehicles",

        "Electronics":
            "electronics",

        "Other":
            "other"

    };

    Object.keys(
        categories
    ).forEach(
        category => {

            const prefix =
                categories[
                    category
                ];

            const count =
                things.filter(
                    thing =>
                        thing.category ===
                        category
                ).length;

            const countElement =
                document.getElementById(
                    prefix +
                    "Count"
                );

            const labelElement =
                document.getElementById(
                    prefix +
                    "Label"
                );

            if (
                countElement
            ) {

                countElement.textContent =
                    count;

            }

            if (
                labelElement
            ) {

                labelElement.textContent =
                    count === 1
                        ? "thing"
                        : "things";

            }

        }
    );

}

async function saveDocumentEdit() {

    if (!documentItem) return;

    let previousDateType =
        documentItem.dateType;

    let previousImportantDate =
        documentItem.importantDate;

    if (!previousDateType) {

        if (
            documentItem.expiryDate
        ) {

            previousDateType =
                "Expiry Date";

            previousImportantDate =
                documentItem.expiryDate;

        } else {

            previousDateType =
                "None";

            previousImportantDate =
                "";

        }

    }

    const name =
        document.getElementById(
            "editDocumentName"
        ).value.trim();

    if (!name) {

        alert(
            "Please enter a document name."
        );

        return;

    }

    const dateType =
        document.getElementById(

        ).value;

    const importantDate =
        dateType ===
        "None"
            ? ""
            : document.getElementById(
                "editDocumentImportantDate"
              ).value;

    documentItem.name =

    documentItem.type =
        document.getElementById(
            "editDocumentType"
        ).value;

    documentItem.date =

        ).value;

    documentItem.importantDate =

    documentItem.expiryDate =
        dateType ===
        "Expiry Date"

            : "";

    documentItem.repeat =
        dateType ===
        "None"
            ? "Never"
            : document.getElementById(
                "editDocumentRepeat"
              ).value;

    documentItem.amount =
        document.getElementById(
            "editDocumentAmount"
        ).value;

    if (
        previousDateType !==
            dateType ||
        previousImportantDate !==
            importantDate
    ) {

        documentItem.notificationAcknowledged =
            false;

    }

    if (
        documentItem.timelineEventId
    ) {

        const event =
            thing.events.find(
                item =>
                    item.id ===
                    documentItem.timelineEventId
            );

        if (event) {

            event.type =
                mapDocumentToEvent(
                    documentItem.type
                );

            event.description =
                documentItem.name;

            event.date =
                documentItem.date ||
                today();

            event.amount =
                documentItem.amount ||
                "";

        }

    }

    const attachmentInput =
        document.getElementById(
            "editDocumentAttachment"
        );

    const newFile =
        attachmentInput &&
        attachmentInput.files &&
        attachmentInput.files[0]
            ? attachmentInput.files[0]
            : null;

    saveThings();

    if (newFile) {

        try {

            await saveAttachment(
                documentItem.id,
                newFile
            );

        } catch(error) {

            console.error(
                error
            );

            alert(
                "The document was updated, but the new attachment could not be saved."
            );

        }

    }

    showThing(
        currentThingId
    );

}

   TIMELINE
========================================================= */

function renderTimeline(
    thing
) {

    const container =
        document.getElementById(
            "timelineList"
        );

    if (
        !thing.events ||
        thing.events.length ===
        0
    ) {

        container.innerHTML = `

            <div class="card empty">
                No timeline events yet.
            </div>

        `;

        return;

    }

    const grouped =
        {};

    thing.events.forEach(
        event => {

            const date =
                event.date ||
                today();

            const key =
                date.substring(
                    0,
                    7
                );

            if (
                !grouped[key]
            ) {

                grouped[key] =
                    [];

            }

            grouped[key].push(
                event
            );

        }
    );

    const months =
        Object.keys(
            grouped
        ).sort(
            (
                a,
                b
            ) =>
                b.localeCompare(a)
        );

    container.innerHTML =
        months.map(
            monthKey => {

                const events =
                    grouped[
                        monthKey
                    ].sort(
                        (
                            a,
                            b
                        ) =>
                            (
                                b.date ||
                                ""
                            ).localeCompare(
                                a.date ||
                                ""
                            )
                    );

                const [
                    year,
                    month
                ] =
                    monthKey.split(
                        "-"
                    );

                const monthDate =
                    new Date(
                        Number(year),
                        Number(month) - 1,
                        1
                    );

                const monthName =
                    monthDate.toLocaleDateString(
                        "en-GB",
                        {
                            month:
                                "long",

                            year:
                                "numeric"
                        }
                    );

                const sectionId =
                    `timeline-${monthKey.replace(
                        "-",
                        ""
                    )}`;

                return `

                    <div class="card">

                        <div
                            class="timeline-month"
                            onclick="toggleTimelineMonth('${sectionId}')">

                            <div class="timeline-month-left">

                                <div class="month-icon">
                                    🗓️
                                </div>

                                <div>

                                    <strong style="font-size:17px;">
                                        ${monthName}
                                    </strong>

                                    <div style="
                                        color:#777;
                                        font-size:13px;
                                        margin-top:3px;
                                    ">

                                        ${events.length}
                                        ${
                                            events.length ===
                                            1
                                            ? "event"
                                            : "events"
                                        }

                                    </div>

                                </div>

                            </div>

                            <div
                                class="chevron"
                                id="${sectionId}-arrow">
                                ›
                            </div>

                        </div>

                        <div
                            class="timeline-events"
                            id="${sectionId}"
                            style="display:none;">

                            ${
                                events.map(
                                    event => {

                                        const icon =
                                            eventIcons[
                                                event.type
                                            ] ||
                                            "📌";

                                        const amount =
                                            event.amount
                                                ? formatMoney(
                                                    event.amount
                                                  )
                                                : "";

                                        return `

                                            <div
                                                class="timeline-event"
                                                onclick="openTimelineEvent(${event.id})">

                                                <div class="timeline-event-date">
                                                    ${formatDay(
                                                        event.date
                                                    )}
                                                </div>

                                                <div class="event-icon">
                                                    ${icon}
                                                </div>

                                                <div class="timeline-event-info">

                                                    <strong>
                                                        ${escapeHtml(
                                                            event.description
                                                        )}
                                                    </strong>

                                                </div>

                                                ${
                                                    amount
                                                    ? `

                                                        <div class="timeline-event-amount">
                                                            ${amount}
                                                        </div>

                                                    `
                                                    : ""
                                                }

                                                <div class="timeline-event-chevron">
                                                    ›
                                                </div>

                                            </div>

                                        `;

                                    }
                                ).join("")
                            }

                        </div>

                    </div>

                `;

            }
        ).join("");

}

function toggleTimelineMonth(
    id
) {

    const section =
        document.getElementById(
            id
        );

    const arrow =
        document.getElementById(
            id +
            "-arrow"
        );

    if (!section) return;

    if (
        section.style.display ===
        "none"
    ) {

        section.style.display =
            "block";

        if (arrow) {

            arrow.textContent =
                "⌄";

        }

    } else {

        section.style.display =
            "none";

        if (arrow) {

            arrow.textContent =
                "›";

        }

    }

}
