<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Coisable</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px 16px 50px;
}

/* ---------- HEADER ---------- */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
}

.tagline {
    margin-top: 4px;
    color: #777;
    font-size: 15px;
}

/* ---------- VIEWS ---------- */

.view {
    display: none;
}

.view.active {
    display: block;
}

/* ---------- BUTTONS ---------- */

.primary-btn {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 15px;
    border-radius: 12px;
    font-weight: 700;
    margin-bottom: 20px;
}

.secondary-btn {
    width: 100%;
    border: 1px solid #ddd;
    background: white;
    color: #111;
    padding: 13px;
    border-radius: 12px;
    font-weight: 600;
    margin-top: 10px;
}

.danger-btn {
    width: 100%;
    border: none;
    background: #fff0f0;
    color: #c62828;
    padding: 13px;
    border-radius: 12px;
    font-weight: 600;
    margin-top: 10px;
}

/* ---------- SECTIONS ---------- */

.section-title {
    font-size: 20px;
    font-weight: 750;
    margin: 28px 0 12px;
}

.empty {
    background: white;
    border-radius: 14px;
    padding: 22px;
    color: #777;
    text-align: center;
}

/* ---------- THINGS ---------- */

.thing-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.thing-main {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.thing-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    flex-shrink: 0;
}

.thing-name {
    font-weight: 700;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.thing-category {
    font-size: 13px;
    color: #777;
    margin-top: 3px;
}

.chevron {
    color: #aaa;
    font-size: 22px;
}

/* ---------- EXPIRING ---------- */

.expiring-card {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.expiring-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: #fff4e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
}

.expiring-name {
    font-weight: 700;
}

.expiring-meta {
    font-size: 13px;
    color: #777;
    margin-top: 3px;
}

.expired {
    color: #c62828;
    font-weight: 700;
}

.expiring-soon {
    color: #e65100;
    font-weight: 700;
}

/* ---------- FORMS ---------- */

.form-group {
    margin-bottom: 17px;
}

.form-label {
    display: block;
    font-weight: 650;
    font-size: 14px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    border: 1px solid #ddd;
    background: white;
    border-radius: 11px;
    padding: 13px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #999;
}

.back-btn {
    border: none;
    background: none;
    padding: 0;
    margin-bottom: 20px;
    color: #555;
    font-weight: 600;
}

/* ---------- DETAIL ---------- */

.detail-header {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
}

.detail-title-row {
    display: flex;
    align-items: center;
    gap: 14px;
}

.detail-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

.detail-name {
    font-size: 23px;
    font-weight: 800;
}

.detail-category {
    color: #777;
    margin-top: 3px;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

.info-box {
    background: #f7f7f7;
    border-radius: 11px;
    padding: 12px;
}

.info-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 4px;
}

.info-value {
    font-weight: 700;
}

/* ---------- DOCUMENTS ---------- */

.document-card {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
}

.document-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
}

.document-main {
    display: flex;
    gap: 11px;
    min-width: 0;
}

.document-icon {
    width: 42px;
    height: 42px;
    background: #f1f1f1;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.document-name {
    font-weight: 700;
}

.document-type {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.document-actions {
    display: flex;
    gap: 7px;
}

.small-btn {
    border: none;
    background: #f3f3f3;
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 13px;
}

.small-danger {
    color: #c62828;
}

.document-meta {
    margin-top: 11px;
    font-size: 13px;
    color: #666;
}

.timeline-link {
    margin-top: 9px;
    font-size: 13px;
    color: #555;
}

/* ---------- TIMELINE ---------- */

.timeline {
    position: relative;
    margin-top: 8px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 20px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: #e4e4e4;
}

.timeline-card {
    position: relative;
    display: flex;
    gap: 12px;
    margin-bottom: 13px;
}

.timeline-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: white;
    border: 2px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    z-index: 1;
}

.timeline-content {
    background: white;
    border-radius: 14px;
    padding: 13px;
    flex: 1;
    min-width: 0;
}

.timeline-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.timeline-title {
    font-weight: 750;
}

.timeline-type {
    color: #777;
    font-size: 12px;
    margin-top: 2px;
}

.timeline-date {
    color: #777;
    font-size: 13px;
    margin-top: 7px;
}

.timeline-amount {
    font-weight: 700;
    white-space: nowrap;
}

.timeline-document {
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #555;
}

.timeline-actions {
    margin-top: 9px;
    display: flex;
    gap: 7px;
}

/* ---------- CHECKBOX ---------- */

.checkbox-row {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.checkbox-row input {
    width: auto;
}

/* ---------- MOBILE ---------- */

@media (max-width: 480px) {

    .app {
        padding-left: 14px;
        padding-right: 14px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .timeline-top {
        flex-direction: column;
        gap: 3px;
    }

}

</style>

</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">Coisable</div>
        <div class="tagline">Your things. One place.</div>
    </div>


    <!-- ================= HOME ================= -->

    <div id="homeView" class="view active">

        <button class="primary-btn" onclick="showAddForm()">
            + Add Thing
        </button>

        <div class="section-title">
            Your Things
        </div>

        <div id="thingsList"></div>

        <div class="section-title">
            Expiring Soon
        </div>

        <div id="expiringSoon"></div>

    </div>


    <!-- ================= ADD THING ================= -->

    <div id="addView" class="view">

        <button class="back-btn" onclick="showHome()">
            ← Back
        </button>

        <div class="section-title">
            Add Thing
        </div>

        <div class="form-group">
            <label class="form-label">Name</label>
            <input id="thingName"
                   type="text"
                   placeholder="e.g. Mazda MX-5">
        </div>

        <div class="form-group">
            <label class="form-label">Category</label>
            <select id="thingCategory">
                <option value="Car">🚗 Car</option>
                <option value="Home">🏠 Home</option>
                <option value="Electronics">📱 Electronics</option>
                <option value="Appliance">🔌 Appliance</option>
                <option value="Personal">🎒 Personal</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Purchase Date</label>
            <input id="purchaseDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Purchase Price</label>
            <input id="purchasePrice"
                   type="number"
                   step="0.01"
                   placeholder="0.00">
        </div>

        <div class="form-group">
            <label class="form-label">Current Value</label>
            <input id="currentValue"
                   type="number"
                   step="0.01"
                   placeholder="0.00">
        </div>

        <button class="primary-btn" onclick="addThing()">
            Save Thing
        </button>

        <button class="secondary-btn" onclick="showHome()">
            Cancel
        </button>

    </div>


    <!-- ================= DETAIL ================= -->

    <div id="detailView" class="view">

        <button class="back-btn" onclick="showHome()">
            ← Back
        </button>

        <div id="thingDetail"></div>

    </div>


    <!-- ================= EDIT THING ================= -->

    <div id="editThingView" class="view">

        <button class="back-btn" onclick="backToThing()">
            ← Back
        </button>

        <div class="section-title">
            Edit Thing
        </div>

        <div class="form-group">
            <label class="form-label">Name</label>
            <input id="editThingName" type="text">
        </div>

        <div class="form-group">
            <label class="form-label">Category</label>
            <select id="editThingCategory">
                <option value="Car">🚗 Car</option>
                <option value="Home">🏠 Home</option>
                <option value="Electronics">📱 Electronics</option>
                <option value="Appliance">🔌 Appliance</option>
                <option value="Personal">🎒 Personal</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Purchase Date</label>
            <input id="editPurchaseDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Purchase Price</label>
            <input id="editPurchasePrice"
                   type="number"
                   step="0.01">
        </div>

        <div class="form-group">
            <label class="form-label">Current Value</label>
            <input id="editCurrentValue"
                   type="number"
                   step="0.01">
        </div>

        <button class="primary-btn" onclick="saveEdit()">
            Save Changes
        </button>

        <button class="danger-btn" onclick="deleteThing()">
            Delete Thing
        </button>

    </div>


    <!-- ================= ADD DOCUMENT ================= -->

    <div id="addDocumentView" class="view">

        <button class="back-btn" onclick="backToThing()">
            ← Back
        </button>

        <div class="section-title">
            Add Document
        </div>

        <div class="form-group">
            <label class="form-label">Document Name</label>
            <input id="documentName"
                   type="text"
                   placeholder="e.g. Insurance policy">
        </div>

        <div class="form-group">
            <label class="form-label">Type</label>
            <select id="documentType">
                <option value="Invoice">🧾 Invoice</option>
                <option value="Contract">📑 Contract</option>
                <option value="Insurance">🛡️ Insurance</option>
                <option value="Warranty">🔒 Warranty</option>
                <option value="Tax">💶 Tax</option>
                <option value="Certificate">📜 Certificate</option>
                <option value="Repair">🔧 Repair</option>
                <option value="Other">📄 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input id="documentDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Expiry Date</label>
            <input id="documentExpiry" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Amount</label>
            <input id="documentAmount"
                   type="number"
                   step="0.01"
                   placeholder="0.00">
        </div>

        <label class="checkbox-row">
            <input id="addToTimeline" type="checkbox" checked>
            <span>Add to timeline</span>
        </label>

        <button class="primary-btn" onclick="addDocument()">
            Save Document
        </button>

        <button class="secondary-btn" onclick="backToThing()">
            Cancel
        </button>

    </div>


    <!-- ================= EDIT DOCUMENT ================= -->

    <div id="editDocumentView" class="view">

        <button class="back-btn" onclick="backToThing()">
            ← Back
        </button>

        <div class="section-title">
            Edit Document
        </div>

        <div class="form-group">
            <label class="form-label">Document Name</label>
            <input id="editDocumentName" type="text">
        </div>

        <div class="form-group">
            <label class="form-label">Type</label>
            <select id="editDocumentType">
                <option value="Invoice">🧾 Invoice</option>
                <option value="Contract">📑 Contract</option>
                <option value="Insurance">🛡️ Insurance</option>
                <option value="Warranty">🔒 Warranty</option>
                <option value="Tax">💶 Tax</option>
                <option value="Certificate">📜 Certificate</option>
                <option value="Repair">🔧 Repair</option>
                <option value="Other">📄 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input id="editDocumentDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Expiry Date</label>
            <input id="editDocumentExpiry" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Amount</label>
            <input id="editDocumentAmount"
                   type="number"
                   step="0.01">
        </div>

        <button class="primary-btn" onclick="saveDocumentEdit()">
            Save Changes
        </button>

        <button class="danger-btn" onclick="deleteDocument()">
            Delete Document
        </button>

    </div>


    <!-- ================= ADD EVENT ================= -->

    <div id="addEventView" class="view">

        <button class="back-btn" onclick="backToThing()">
            ← Back
        </button>

        <div class="section-title">
            Add Event
        </div>

        <div class="form-group">
            <label class="form-label">Description</label>
            <input id="eventName"
                   type="text"
                   placeholder="e.g. Changed tyres">
        </div>

        <div class="form-group">
            <label class="form-label">Type</label>
            <select id="eventType">
                <option value="Purchase">🛒 Purchase</option>
                <option value="Repair">🔧 Repair</option>
                <option value="Maintenance">🛠️ Maintenance</option>
                <option value="Expense">💶 Expense</option>
                <option value="Inspection">🔍 Inspection</option>
                <option value="Insurance">🛡️ Insurance</option>
                <option value="Other">📌 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input id="eventDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Amount</label>
            <input id="eventAmount"
                   type="number"
                   step="0.01"
                   placeholder="Optional">
        </div>

        <button class="primary-btn" onclick="addEvent()">
            Save Event
        </button>

        <button class="secondary-btn" onclick="backToThing()">
            Cancel
        </button>

    </div>


    <!-- ================= EDIT EVENT ================= -->

    <div id="editEventView" class="view">

        <button class="back-btn" onclick="backToThing()">
            ← Back
        </button>

        <div class="section-title">
            Edit Event
        </div>

        <div class="form-group">
            <label class="form-label">Description</label>
            <input id="editEventName" type="text">
        </div>

        <div class="form-group">
            <label class="form-label">Type</label>
            <select id="editEventType">
                <option value="Purchase">🛒 Purchase</option>
                <option value="Repair">🔧 Repair</option>
                <option value="Maintenance">🛠️ Maintenance</option>
                <option value="Expense">💶 Expense</option>
                <option value="Inspection">🔍 Inspection</option>
                <option value="Insurance">🛡️ Insurance</option>
                <option value="Other">📌 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input id="editEventDate" type="date">
        </div>

        <div class="form-group">
            <label class="form-label">Amount</label>
            <input id="editEventAmount"
                   type="number"
                   step="0.01">
        </div>

        <button class="primary-btn" onclick="saveEventEdit()">
            Save Changes
        </button>

        <button class="danger-btn" onclick="deleteEvent()">
            Delete Event
        </button>

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let things = JSON.parse(
    localStorage.getItem("coisableThings")
) || [];

let currentThingId = null;
let currentDocumentId = null;
let currentEventId = null;


/* =========================================================
   ICONS
========================================================= */

const categoryIcons = {
    Car: "🚗",
    Home: "🏠",
    Electronics: "📱",
    Appliance: "🔌",
    Personal: "🎒",
    Other: "📦"
};

const documentIcons = {
    Invoice: "🧾",
    Contract: "📑",
    Insurance: "🛡️",
    Warranty: "🔒",
    Tax: "💶",
    Certificate: "📜",
    Repair: "🔧",
    Other: "📄"
};

const eventIcons = {
    Purchase: "🛒",
    Repair: "🔧",
    Maintenance: "🛠️",
    Expense: "💶",
    Inspection: "🔍",
    Insurance: "🛡️",
    Other: "📌"
};


/* =========================================================
   MIGRATION
========================================================= */

things = things.map(thing => {

    if (!Array.isArray(thing.documents)) {
        thing.documents = [];
    }

    if (!Array.isArray(thing.events)) {
        thing.events = [];
    }

    thing.documents = thing.documents.map(doc => {

        if (!doc.id) {
            doc.id = Date.now().toString() +
                     Math.random().toString(36).slice(2);
        }

        return doc;
    });

    thing.events = thing.events.map(event => {

        if (!event.id) {
            event.id = Date.now().toString() +
                       Math.random().toString(36).slice(2);
        }

        return event;
    });

    return thing;
});

saveThings();


/* =========================================================
   STORAGE
========================================================= */

function saveThings() {

    localStorage.setItem(
        "coisableThings",
        JSON.stringify(things)
    );
}


/* =========================================================
   VIEW MANAGEMENT
========================================================= */

function showView(id) {

    document.querySelectorAll(".view")
        .forEach(view => view.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    window.scrollTo(0, 0);
}


/* =========================================================
   HOME
========================================================= */

function showHome() {

    currentThingId = null;
    currentDocumentId = null;
    currentEventId = null;

    renderThings();
    renderExpiringSoon();

    showView("homeView");
}


/* =========================================================
   ADD THING
========================================================= */

function showAddForm() {

    document.getElementById("thingName").value = "";
    document.getElementById("thingCategory").value = "Car";
    document.getElementById("purchaseDate").value = "";
    document.getElementById("purchasePrice").value = "";
    document.getElementById("currentValue").value = "";

    showView("addView");
}


function addThing() {

    const name =
        document.getElementById("thingName").value.trim();

    if (!name) {
        alert("Please enter a name.");
        return;
    }

    const thing = {

        id:
            Date.now().toString() +
            Math.random().toString(36).slice(2),

        name,

        category:
            document.getElementById("thingCategory").value,

        purchaseDate:
            document.getElementById("purchaseDate").value,

        purchasePrice:
            parseFloat(
                document.getElementById("purchasePrice").value
            ) || 0,

        currentValue:
            parseFloat(
                document.getElementById("currentValue").value
            ) || 0,

        documents: [],

        events: []

    };

    things.push(thing);

    saveThings();

    openThing(thing.id);
}


/* =========================================================
   THINGS LIST
========================================================= */

function renderThings() {

    const container =
        document.getElementById("thingsList");

    if (!things.length) {

        container.innerHTML = `
            <div class="empty">
                No things yet.<br>
                Add your first thing above.
            </div>
        `;

        return;
    }

    container.innerHTML = things.map(thing => {

        const icon =
            categoryIcons[thing.category] || "📦";

        return `
            <div class="thing-card"
                 onclick="openThing('${thing.id}')">

                <div class="thing-main">

                    <div class="thing-icon">
                        ${icon}
                    </div>

                    <div>
                        <div class="thing-name">
                            ${escapeHtml(thing.name)}
                        </div>

                        <div class="thing-category">
                            ${escapeHtml(thing.category)}
                        </div>
                    </div>

                </div>

                <div class="chevron">
                    ›
                </div>

            </div>
        `;

    }).join("");
}


/* =========================================================
   OPEN THING
========================================================= */

function openThing(id) {

/* =========================================================
   DETAIL
========================================================= */

function showThing() {

    const thing =
        things.find(t => t.id === currentThingId);

    if (!thing) {
        showHome();
        return;
    }

    const icon =
        categoryIcons[thing.category] || "📦";

    const documents =
        thing.documents || [];

    const events =
        thing.events || [];

    let documentsHtml = "";

    if (!documents.length) {

        documentsHtml = `
            <div class="empty">
                No documents yet.
            </div>
        `;

    } else {

        documentsHtml = documents
            .slice()
            .sort((a, b) =>
                (b.date || "").localeCompare(a.date || "")
            )
            .map(doc => {

                const docIcon =
                    documentIcons[doc.type] || "📄";

                const linkedEvent =
                    events.some(event =>
                        event.documentId === doc.id
                    );

                return `
                    <div class="document-card">

                        <div class="document-top">

                            <div class="document-main">

                                <div class="document-icon">
                                    ${docIcon}
                                </div>

                                <div>

                                    <div class="document-name">
                                        ${escapeHtml(doc.name)}
                                    </div>

                                    <div class="document-type">
                                        ${escapeHtml(doc.type)}
                                    </div>

                                </div>

                            </div>

                            <div class="document-actions">

                                <button
                                    class="small-btn"
                                    onclick="event.stopPropagation(); editDocument('${doc.id}')">
                                    Edit
                                </button>

                                <button
                                    class="small-btn small-danger"
                                    onclick="event.stopPropagation(); deleteDocumentDirect('${doc.id}')">
                                    Delete
                                </button>

                            </div>

                        </div>

                        <div class="document-meta">

                            ${doc.date
                                ? "Date: " + formatDate(doc.date)
                                : ""
                            }

                            ${doc.expiryDate
                                ? " · Expires: " + formatDate(doc.expiryDate)
                                : ""
                            }

                            ${doc.amount
                                ? " · " + formatMoney(doc.amount)
                                : ""
                            }

                        </div>

                        ${linkedEvent
                            ? `
                                <div class="timeline-link">
                                    🔗 Added to timeline
                                </div>
                              `
                            : ""
                        }

                    </div>
                `;

            }).join("");
    }


    /* ---------- TIMELINE ---------- */

    let timelineHtml = "";

    const sortedEvents =
        events
            .slice()
            .sort((a, b) =>
                (b.date || "").localeCompare(a.date || "")
            );

    if (!sortedEvents.length) {

        timelineHtml = `
            <div class="empty">
                No events yet.
            </div>
        `;

    } else {

        timelineHtml = `
            <div class="timeline">

                ${sortedEvents.map(event => {

                    const eventIcon =
                        eventIcons[event.type] || "📌";

                    const linkedDocument =
                        documents.find(doc =>
                            doc.id === event.documentId
                        );

                    return `
                        <div class="timeline-card">

                            <div class="timeline-icon">
                                ${eventIcon}
                            </div>

                            <div class="timeline-content">

                                <div class="timeline-top">

                                    <div>
                                        <div class="timeline-title">
                                            ${escapeHtml(event.name)}
                                        </div>

                                        <div class="timeline-type">
                                            ${escapeHtml(event.type)}
                                        </div>
                                    </div>

                                    ${event.amount
                                        ? `
                                            <div class="timeline-amount">
                                                ${formatMoney(event.amount)}
                                            </div>
                                          `
                                        : ""
                                    }

                                </div>

                                ${event.date
                                    ? `
                                        <div class="timeline-date">
                                            ${formatDate(event.date)}
                                        </div>
                                      `
                                    : ""
                                }

                                ${linkedDocument
                                    ? `
                                        <div class="timeline-document">
                                            📄 ${escapeHtml(linkedDocument.name)}
                                        </div>
                                      `
                                    : ""
                                }

                                <div class="timeline-actions">

                                    <button
                                        class="small-btn"
                                        onclick="editEvent('${event.id}')">
                                        Edit
                                    </button>

                                    <button
                                        class="small-btn small-danger"
                                        onclick="deleteEventDirect('${event.id}')">
                                        Delete
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;

                }).join("")}

            </div>
        `;
    }


    document.getElementById("thingDetail").innerHTML = `

        <div class="detail-header">

            <div class="detail-title-row">

                <div class="detail-icon">
                    ${icon}
                </div>

                <div>
                    <div class="detail-name">
                        ${escapeHtml(thing.name)}
                    </div>

                    <div class="detail-category">
                        ${escapeHtml(thing.category)}
                    </div>
                </div>

            </div>

            <div class="info-grid">

                <div class="info-box">
                    <div class="info-label">
                        Purchase Date
                    </div>

                    <div class="info-value">
                        ${thing.purchaseDate
                            ? formatDate(thing.purchaseDate)
                            : "—"
                        }
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">
                        Purchase Price
                    </div>

                    <div class="info-value">
                        ${thing.purchasePrice
                            ? formatMoney(thing.purchasePrice)
                            : "—"
                        }
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">
                        Current Value
                    </div>

                    <div class="info-value">
                        ${thing.currentValue
                            ? formatMoney(thing.currentValue)
                            : "—"
                        }
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">
                        Documents
                    </div>

                    <div class="info-value">
                        ${documents.length}
                    </div>
                </div>

            </div>

        </div>


        <button class="secondary-btn"
                onclick="editThing()">
            Edit Thing
        </button>


        <div class="section-title">
            Documents
        </div>

        <button class="primary-btn"
                onclick="showAddDocument()">
            + Add Document
        </button>

        ${documentsHtml}


        <div class="section-title">
            Timeline
        </div>

        <button class="primary-btn"
                onclick="showAddEvent()">
            + Add Event
        </button>

        ${timelineHtml}

    `;
}


/* =========================================================
   ADD DOCUMENT
========================================================= */

function showAddDocument() {

    document.getElementById("documentName").value = "";
    document.getElementById("documentType").value = "Invoice";
    document.getElementById("documentDate").value = "";
    document.getElementById("documentExpiry").value = "";
    document.getElementById("documentAmount").value = "";
    document.getElementById("addToTimeline").checked = true;

    showView("addDocumentView");
}


function addDocument() {

    const thing =
        things.find(t => t.id === currentThingId);

    if (!thing) return;

    const name =
        document.getElementById("documentName")
            .value
            .trim();

    if (!name) {

        alert("Please enter a document name.");
        return;
    }

    const documentId =
        Date.now().toString() +
        Math.random().toString(36).slice(2);

    const doc = {

        id: documentId,

        name,

        type:
            document.getElementById("documentType").value,

        date:
            document.getElementById("documentDate").value,

        expiryDate:
            document.getElementById("documentExpiry").value,

        amount:
            parseFloat(
                document.getElementById("documentAmount").value
            ) || 0

    };

    thing.documents.push(doc);


    /* ---------- ADD TO TIMELINE ---------- */

    const addTimeline =
        document.getElementById("addToTimeline").checked;

    if (addTimeline) {

        let eventType = "Other";

        /*
         * Try to make the event type sensible
         * based on the document type.
         */

        if (doc.type === "Repair") {
            eventType = "Repair";
        }

        else if (doc.type === "Insurance") {
            eventType = "Insurance";
        }

        else if (doc.type === "Invoice") {
            eventType = "Expense";
        }

        else if (doc.type === "Certificate") {
            eventType = "Inspection";
        }

        else if (doc.type === "Contract") {
            eventType = "Other";
        }

        else if (doc.type === "Warranty") {
            eventType = "Other";
        }

        else if (doc.type === "Tax") {
            eventType = "Expense";
        }


        const event = {

            id:
                Date.now().toString() +
                Math.random().toString(36).slice(2),

            name: doc.name,

            type: eventType,

            date: doc.date,

            amount: doc.amount,

            documentId: doc.id

        };

        thing.events.push(event);
    }


    saveThings();

    showThing();

    showView("detailView");
}


/* =========================================================
   EDIT DOCUMENT
========================================================= */

function editDocument(id) {

    currentDocumentId = id;

    const thing =
        things.find(t => t.id === currentThingId);

    if (!thing) return;

    const documentItem =
        thing.documents.find(d => d.id === id);

    if (!documentItem) return;

    document.getElementById("editDocumentName").value =
        documentItem.name || "";

    document.getElementById("editDocumentType").value =
        documentItem.type || "Other";

    document.getElementById("editDocumentDate").value =
        documentItem.date || "";

    document.getElementById("editDocumentExpiry").value =
        documentItem.expiryDate || "";

    document.getElementById("editDocumentAmount").value =
        documentItem.amount || "";

    showView("editDocumentView");
}


function saveDocumentEdit() {

    const thing =
        things.find(t => t.id === currentThingId);

    if (!thing) return;

    const documentItem =
        thing.documents.find(
            d => d.id === currentDocumentId
        );

    if (!documentItem) return;

    const oldName = documentItem.name;
    const oldType = documentItem.type;
    const oldDate = documentItem.date;
    const oldAmount = documentItem.amount;

    documentItem.name =
        document.getElementById("editDocumentName")
            .value
            .trim();

    documentItem.type =
        document.getElementById("editDocumentType").value;

    documentItem.date =
        document.getElementById("editDocumentDate").value;

    documentItem.expiryDate =
        document.getElementById("editDocumentExpiry").value;

    documentItem.amount =
        parseFloat(
            document.getElementById("editDocumentAmount").value
        ) || 0;


    /*
     * If this document already has a linked timeline event,
     * keep the event synchronized with the document.
     */

    const linkedEvent =
        thing.events.find(
            event => event.documentId === documentItem.id
        );

    if (linkedEvent) {

        linkedEvent.name =
            documentItem.name;

        linkedEvent.date =
            documentItem.date;

        linkedEvent.amount =
            documentItem.amount;

        /*
         * Recalculate event type if the document type changed.
         */

        if (documentItem.type === "Repair") {
            linkedEvent.type = "Repair";
        }

        else if (documentItem.type === "Insurance") {
            linkedEvent.type = "Insurance";
        }

        else if (documentItem.type === "Invoice") {
            linkedEvent.type = "Expense";
        }

        else if (documentItem.type === "Certificate") {
            linkedEvent.type = "Inspection";
        }

        else if (documentItem.type === "Tax") {
            linkedEvent.type = "Expense";
        }

        else {
            linkedEvent.type = "Other";
        }
    }


    saveThings();

    showThing();

    showView("detailView");
}


/* =========================================================
   DELETE DOCUMENT
========================================================= */

function deleteDocument() {

    deleteDocumentDirect(currentDocumentId);
}


function deleteDocumentDirect(id) {

    const thing =
        things.find(t => t.id === currentThingId);

    if (!thing) return;

    const documentItem =
        thing.documents.find(d => d.id === id);

    if (!documentItem) return;

    const confirmed =
        confirm(
            "Delete this document?"
        );

    if (!confirmed) return;


    /*
     * IMPORTANT:
     *
     * We do NOT delete the timeline event.
     * The event remains as historical information.
     */

    thing.documents =
        thing.documents.filter(
            d => d.id !== id
        );

    saveThings();

    showThing();

    showView("detailView");
}

/* =========================================================
   EXPIRING SOON
========================================================= */

function renderExpiringSoon() {

    const container =
        document.getElementById("expiringSoon");

    const today =
        new Date();

    today.setHours(0, 0, 0, 0);

    const limit =
        new Date(today);

    limit.setDate(
        limit.getDate() + 30
    );

    const items = [];

    things.forEach(thing => {

        (thing.documents || []).forEach(doc => {

            if (!doc.expiryDate) return;

            const expiry =
                new Date(
                    doc.expiryDate + "T00:00:00"
                );

            if (
                expiry <= limit
            ) {

                items.push({
                    thing,
                    doc,
                    expiry
                });

            }

        });

    });


    items.sort(
        (a, b) =>
            a.expiry - b.expiry
    );


    if (!items.length) {

        container.innerHTML = `
            <div class="empty">
                Nothing expiring in the next 30 days.
            </div>
        `;

        return;
    }


    container.innerHTML =
        items.map(item => {

            const days =
                Math.round(
                    (
                        item.expiry - today
                    ) /
                    (1000 * 60 * 60 * 24)
                );

            let status = "";
            let statusClass = "";

            if (days < 0) {

                const absoluteDays =
                    Math.abs(days);

                status =
                    "Expired " +
                    absoluteDays +
                    (absoluteDays === 1
                        ? " day ago"
                        : " days ago");

                statusClass = "expired";

            }

            else if (days === 0) {

                status =
                    "Expires today";

                statusClass =
                    "expired";

            }

            else {

                status =
                    "Expires in " +
                    days +
                    (days === 1
                        ? " day"
                        : " days");

                statusClass =
                    "expiring-soon";
            }


            const icon =
                documentIcons[item.doc.type] ||
                "📄";


            return `
                <div class="expiring-card"
                     onclick="openThing('${item.thing.id}')">

                    <div class="expiring-icon">
                        ${icon}
                    </div>

                    <div>

                        <div class="expiring-name">
                            ${escapeHtml(item.doc.name)}
                        </div>

                        <div class="expiring-meta">
                            ${escapeHtml(item.thing.name)}
                            ·
                            ${formatDate(item.doc.expiryDate)}
                        </div>

                        <div class="${statusClass}">
                            ${status}
                        </div>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   FORMATTING
========================================================= */

function formatDate(dateString) {

    if (!dateString) return "";

    const date =
        new Date(
            dateString + "T00:00:00"
        );

    return date.toLocaleDateString(
        "en-GB"
    );
}


function formatMoney(value) {

    return new Intl.NumberFormat(
        "en-IE",
        {
            style: "currency",
            currency: "EUR"
        }
    ).format(value);
}


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
