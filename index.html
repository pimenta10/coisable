        null;

    showThing(
        currentThingId
    );

}


/* =========================================================
   COMING UP
========================================================= */

function renderComingUp() {

    const container =
        document.getElementById(
            "comingUp"
        );

    const todayDate =
        new Date();

    todayDate.setHours(
        0,
        0,
        0,
        0
    );

    const limitDate =
        new Date(
            todayDate
        );

    limitDate.setDate(
        limitDate.getDate() +
        30
    );

    const upcoming =
        [];

    things.forEach(
        thing => {

            if (
                !Array.isArray(
                    thing.documents
                )
            ) {

                return;

            }

            thing.documents.forEach(
                documentItem => {

                    let dateType =
                        documentItem.dateType;

                    let importantDate =
                        documentItem.importantDate;

                    if (!dateType) {

                        if (
                            documentItem.expiryDate
                        ) {

                            dateType =
                                "Expiry Date";

                            importantDate =
                                documentItem.expiryDate;

                        } else {

                            dateType =
                                "None";

                        }

                    }

                    if (
                        dateType ===
                            "None" ||
                        !importantDate
                    ) {

                        return;

                    }

                    const important =
                        new Date(
                            importantDate +
                            "T00:00:00"
                        );

                    let notificationDate =
                        new Date(
                            important
                        );

                    const repeat =
                        documentItem.repeat ||
                        "Never";

                    if (
                        documentItem.notificationAcknowledged &&
                        repeat !==
                            "Never"
                    ) {

                        while (
                            notificationDate <
                            todayDate
                        ) {

                            notificationDate =
                                addRepeat(
                                    notificationDate,
                                    repeat
                                );

                        }

                    }

                    if (
                        documentItem.notificationAcknowledged &&
                        notificationDate >
                            limitDate
                    ) {

                        return;

                    }

                    if (
                        documentItem.notificationAcknowledged &&
                        repeat ===
                            "Never"
                    ) {

                        return;

                    }

                    if (
                        notificationDate <=
                        limitDate
                    ) {

                        upcoming.push({

                            thing:

                                thing,

                            document:

                                documentItem,

                            dateType:

                                dateType,

                            importantDate:

                                formatDateForStorage(
                                    notificationDate
                                ),

                            important:

                                notificationDate

                        });

                    }

                }
            );

        }
    );

    upcoming.sort(
        (
            a,
            b
        ) =>
            a.important -
            b.important
    );

    if (
        upcoming.length ===
        0
    ) {

        container.innerHTML = `

            <div class="card empty">
                Nothing coming up.
            </div>

        `;

        return;

    }

    container.innerHTML =
        upcoming.map(
            item => {

                const diff =
                    Math.ceil(
                        (
                            item.important -
                            todayDate
                        ) /
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    );

                const isDue =
                    item.dateType ===
                    "Due Date";

                let status;
                let className;

                if (
                    diff < 0
                ) {

                    const days =
                        Math.abs(
                            diff
                        );

                    if (isDue) {

                        status =
                            `Overdue ${days} ${
                                days === 1
                                ? "day"
                                : "days"
                            }`;

                    } else {

                        status =
                            `Expired ${days} ${
                                days === 1
                                ? "day"
                                : "days"
                            } ago`;

                    }

                    className =
                        "coming-up-overdue";

                } else if (
                    diff === 0
                ) {

                    status =
                        isDue
                            ? "Due today"
                            : "Expires today";

                    className =
                        "coming-up-overdue";

                } else {

                    status =
                        isDue
                            ? `Due in ${diff} ${
                                diff === 1
                                ? "day"
                                : "days"
                              }`
                            : `Expires in ${diff} ${
                                diff === 1
                                ? "day"
                                : "days"
                              }`;

                    className =
                        "coming-up";

                }

                const icon =
                    documentIcons[
                        item.document.type
                    ] ||
                    "📄";

                return `

                    <div
                        class="card ${className}"
                        onclick="openThing(${item.thing.id})"
                        style="cursor:pointer;">

                        <div style="
                            display:flex;
                            gap:12px;
                        ">

                            <div class="document-icon">
                                ${icon}
                            </div>

                            <div style="flex:1;">

                                <div class="coming-up-title">

                                    ${escapeHtml(
                                        item.document.name
                                    )}

                                </div>

                                <div class="coming-up-meta">

                                    ${escapeHtml(
                                        item.thing.name
                                    )}

                                </div>

                                <div class="coming-up-meta">

                                    ${escapeHtml(
                                        item.dateType
                                    )}
                                    ·
                                    ${formatDate(
                                        item.importantDate
                                    )}

                                    ${
                                        item.document.repeat &&
                                        item.document.repeat !==
                                            "Never"
                                        ? ` · ${escapeHtml(
                                            item.document.repeat
                                          )}`
                                        : ""
                                    }

                                </div>

                                <div class="coming-up-status">
                                    ${status}
                                </div>

                            </div>

                        </div>

                        <div class="coming-up-actions">

                            <button
                                class="secondary small coming-up-acknowledge"
                                onclick="acknowledgeNotification(${item.document.id}, event)">
                                Acknowledge
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function acknowledgeNotification(
    documentId,
    clickEvent
) {

    if (
        clickEvent
    ) {

        clickEvent.stopPropagation();

    }

    let found =
        false;

    things.forEach(
        thing => {

            if (
                !Array.isArray(
                    thing.documents
                )
            ) {

                return;

            }

            const documentItem =
                thing.documents.find(
                    item =>
                        item.id ===
                        documentId
                );

            if (!documentItem) {

                return;

            }

            documentItem.notificationAcknowledged =
                true;

            const repeat =
                documentItem.repeat ||
                "Never";

            if (
                repeat !==
                    "Never" &&
                documentItem.importantDate
            ) {

                const currentDate =
                    new Date(
                        documentItem.importantDate +
                        "T00:00:00"
                    );

                const nextDate =
                    addRepeat(
                        currentDate,
                        repeat
                    );

                documentItem.importantDate =
                    formatDateForStorage(
                        nextDate
                    );

                if (
                    documentItem.dateType ===
                    "Expiry Date"
                ) {

                    documentItem.expiryDate =
                        documentItem.importantDate;

                }

            }

            found =
                true;

        }
    );

    if (!found) return;

    saveThings();

    renderComingUp();

}


/* =========================================================
   REPEAT
========================================================= */

function addRepeat(
    date,
    repeat
) {

    const result =
        new Date(
            date
        );

    if (
        repeat ===
        "Yearly"
    ) {

        result.setFullYear(
            result.getFullYear() +
            1
        );

    } else if (
        repeat ===
        "Monthly"
    ) {

        result.setMonth(
            result.getMonth() +
            1
        );

    }

    return result;

}

function formatDateForStorage(
    date
) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() +
            1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${year}-${month}-${day}`;

}


/* =========================================================
   HELPERS
========================================================= */

function mapDocumentToEvent(
    type
) {

    const mapping = {

        Invoice:
            "Expense",

        Contract:
            "Other",

        Insurance:
            "Insurance",

        Warranty:
            "Other",

        Tax:
            "Expense",

        Certificate:
            "Other",

        Repair:
            "Repair",

        Other:
            "Other"

    };

    return mapping[type] ||
        "Other";

}

function today() {

    const date =
        new Date();

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() +
            1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${year}-${month}-${day}`;

}

function formatDate(
    dateString
) {

    if (!dateString) {

        return "—";

    }

    const parts =
        dateString.split(
            "-"
        );

    if (
        parts.length !==
        3
    ) {

        return dateString;

    }

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}

function formatDay(
    dateString
) {

    if (!dateString) {

        return "—";

    }

    const parts =
        dateString.split(
            "-"
        );

    if (
        parts.length !==
        3
    ) {

        return dateString;

    }

    return String(
        Number(
            parts[2]
        )
    );

}

function formatMoney(
    value
) {

    if (
        value === "" ||
        value === null ||
        value === undefined
    ) {

        return "—";

    }

    const number =
        Number(
            value
        );

    if (
        Number.isNaN(
            number
        )
    ) {

        return "—";

    }

    return new Intl.NumberFormat(
        "pt-PT",
        {
            style:
                "currency",

            currency:
                "EUR"
        }
    ).format(
        number
    );

}

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   RESIZE
========================================================= */

let attachmentResizeTimer =
    null;

window.addEventListener(
    "resize",
    function() {

        const attachmentView =
            document.getElementById(
                "attachmentView"
            );

        if (
            !attachmentView ||
            !attachmentView.classList.contains(
                "active"
            )
        ) {

            return;

        }

        clearTimeout(
            attachmentResizeTimer
        );

        attachmentResizeTimer =
            setTimeout(
                async function() {

                    if (
                        !attachmentIsFit
                    ) {

                        return;

                    }

                    if (
                        attachmentIsPdf
                    ) {

                        await renderPdf();

                    } else {

                        attachmentImageFitScale =
                            calculateImageFitScale();

                        applyImageZoom();

                    }

                },
                150
            );

    }
);


/* =========================================================
   DATA MIGRATION
========================================================= */

things.forEach(
    thing => {

        if (
            thing.category ===
            "Home"
        ) {

            thing.category =
                "Real Estate";

        }

        if (
            thing.category ===
            "Vehicle"
        ) {

            thing.category =
                "Vehicles";

        }

        if (
            thing.category ===
            "Appliance"
        ) {

            thing.category =
                "Other";

        }

        if (
            !Array.isArray(
                thing.documents
            )
        ) {

            thing.documents =
                [];

        }

        if (
            !Array.isArray(
                thing.events
            )
        ) {

            thing.events =
                [];

        }

        thing.documents.forEach(
            documentItem => {

                if (
                    documentItem.timelineEventId ===
                    undefined
                ) {

                    documentItem.timelineEventId =
                        null;

                }

                if (
                    documentItem.notificationAcknowledged ===
                    undefined
                ) {

                    documentItem.notificationAcknowledged =
                        false;

                }

                if (
                    !documentItem.dateType
                ) {

                    if (
                        documentItem.expiryDate
                    ) {

                        documentItem.dateType =
                            "Expiry Date";

                        documentItem.importantDate =
                            documentItem.expiryDate;

                    } else {

                        documentItem.dateType =
                            "None";

                        documentItem.importantDate =
                            "";

                    }

                } else if (
                    documentItem.importantDate ===
                    undefined
                ) {

                    documentItem.importantDate =
                        documentItem.expiryDate ||
                        "";

                }

                if (
                    documentItem.repeat ===
                    undefined
                ) {

                    documentItem.repeat =
                        "Never";

                }

            }
        );

    }
);

saveThings();


/* =========================================================
   INITIAL LOAD
========================================================= */

renderCategoryCounts();

renderComingUp();

initAttachmentDB()
    .catch(
        error => {

            console.error(
                "Attachment storage could not be initialized:",
                error
            );

        }
    );

</script>
